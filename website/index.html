<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="robots" content="noindex" />
  <title>Redirecting…</title>
  <link rel="canonical" href="https://gbenigno.github.io/" />
  <meta http-equiv="refresh" content="0; url=https://gbenigno.github.io/" />
  <script>
    const destination = new URL("/", window.location.origin);
    destination.search = window.location.search;
    destination.hash = window.location.hash;
    window.location.replace(destination);
  </script>
</head>
<body>
  <p>This page has moved to <a href="https://gbenigno.github.io/">gbenigno.github.io</a>.</p>
</body>
</html>
